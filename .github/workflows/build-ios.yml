name: Build Blender iOS

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Signing method'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - development

env:
  CMAKE_BUILD_TYPE: Release
  BLENDER_REPO: salmazov/blender-ios
  BLENDER_BRANCH: ios-new

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Clone Blender iOS source (skip LFS smudge)
        run: |
          # LFS 서버에 없는 에셋 파일이 있어 smudge 실패
          # GIT_LFS_SKIP_SMUDGE=1로 클론 후 필요한 LFS만 선택적으로 pull
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --branch ${{ env.BLENDER_BRANCH }} \
            https://github.com/${{ env.BLENDER_REPO }}.git blender-ios
          cd blender-ios
          git lfs install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Xcode & iOS SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        run: |
          brew install cmake git-lfs
          git lfs install

      - name: Restore essential LFS assets
        run: |
          cd blender-ios
          # startup.blend는 CMake 필수 체크 대상이므로 반드시 받아야 함
          git lfs pull --include="release/datafiles/startup.blend" 2>&1 || true
          git lfs pull --include="*.h" --include="*.a" --include="*.dylib" 2>&1 || true
          # 서브모듈에도 LFS가 있으면 복원
          git submodule foreach --recursive "git lfs pull 2>&1 || true" 2>&1 || true

      - name: Verify startup.blend
        run: |
          ls -la blender-ios/release/datafiles/startup.blend 2>/dev/null || echo "startup.blend not found"
          # CMakeLists.txt에서 1KB 미만이면 FATAL_ERROR 발생하므로
          # 파일이 없으면 임시 빈 파일 생성 (빌드 실패 방지)
          if [ ! -f blender-ios/release/datafiles/startup.blend ]; then
            mkdir -p blender-ios/release/datafiles
            dd if=/dev/zero of=blender-ios/release/datafiles/startup.blend bs=1024 count=2 2>/dev/null
            echo "Created placeholder startup.blend (2KB)"
          fi

      - name: Fetch prebuilt libraries
        run: |
          cd blender-ios
          export GIT_LFS_SKIP_SMUDGE=1
          git submodule update --init --depth 1 lib/ios_arm64 2>&1 || true
          git submodule update --init --depth 1 lib/macos_arm64 2>&1 || true
          cd lib/ios_arm64 && git lfs pull 2>&1 || true
          cd ../../lib/macos_arm64 && git lfs pull 2>&1 || true

      - name: Verify libraries
        run: |
          ls -la blender-ios/lib/ios_arm64/
          find blender-ios/lib/ios_arm64/python/lib -name "*.a" 2>/dev/null | head -5

      - name: Configure CMake
        run: |
          cd blender-ios
          mkdir -p build_ios
          cd build_ios
          IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          IOS_DEV_ROOT=$(dirname "$IOS_SDK_PATH")
          cmake -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DWITH_APPLE_CROSSPLATFORM=ON \
            -DAPPLE_TARGET_DEVICE=ios \
            -DCMAKE_FIND_ROOT_PATH="$IOS_DEV_ROOT;$(dirname "$IOS_DEV_ROOT");$(pwd)/../lib/ios_arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED="NO" \
            ..

      - name: Build
        run: |
          cd blender-ios/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -scheme blender \
            -configuration Release \
            -sdk iphoneos \
            -jobs $(sysctl -n hw.ncpu) \
            build 2>&1 | tail -80

      - name: Locate built app
        id: locate_app
        run: |
          APP_PATH=$(find blender-ios/build_ios -name "Blender.app" -type d -not -path "*/release/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Blender.app" -type d | head -1)
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH" 2>/dev/null || echo "APP NOT FOUND"

      - name: Create unsigned IPA
        if: ${{ github.event.inputs.signing == 'unsigned' }}
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          mkdir -p Payload
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/Blender.app
          else
            # fallback
            find blender-ios/build_ios -name "*.app" -type d | head -3
            APP_PATH=$(find blender-ios/build_ios -name "*.app" -type d | head -1)
            cp -R "$APP_PATH" Payload/Blender.app 2>/dev/null || exit 1
          fi
          zip -r Blender.ipa Payload/
          ls -lh Blender.ipa

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-${{ github.sha }}
          path: Blender.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: blender-ios/build_ios/**/*.log
          retention-days: 3
